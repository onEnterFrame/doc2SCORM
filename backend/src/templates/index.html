<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc2SCORM Course</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    #app {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .course-title {
      text-align: center;
      font-size: 1.8em;
      color: #1a1a2e;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 3px solid #4a90d9;
    }
    .module-header {
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      border-radius: 8px 8px 0 0;
      font-size: 1.2em;
      margin-top: 24px;
    }
    .screen {
      background: white;
      border-radius: 0 0 8px 8px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .screen-title {
      font-size: 1.3em;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    .screen-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
      margin: 16px 0;
      background: #eee;
    }
    .story-text {
      font-size: 1.1em;
      margin-bottom: 12px;
      padding: 16px;
      background: #f8f9fa;
      border-left: 4px solid #4a90d9;
      border-radius: 0 4px 4px 0;
    }
    .on-screen-text {
      font-weight: 600;
      color: #4a90d9;
      font-size: 1.05em;
      margin: 12px 0;
    }
    .narration-text {
      font-style: italic;
      color: #666;
      margin: 8px 0;
    }
    .audio-player {
      width: 100%;
      margin: 12px 0;
    }
    .interaction {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }
    .interaction-label {
      font-weight: 700;
      color: #856404;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 0.85em;
    }
    .interaction-prompt {
      font-size: 1.05em;
      color: #533f03;
    }
    .decision-box {
      border-color: #4a90d9;
      background: #e8f0fe;
    }
    .decision-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .decision-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }
    .decision-btn:hover:not(:disabled) { border-color: #4a90d9; background: #f0f7ff; }
    .decision-btn:disabled { cursor: default; }
    .quiz-container {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin: 16px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .quiz-title {
      font-size: 1.2em;
      color: #1a1a2e;
      margin-bottom: 16px;
    }
    .quiz-question {
      margin-bottom: 20px;
    }
    .quiz-question p {
      font-weight: 600;
      margin-bottom: 8px;
    }
    .quiz-choice {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      margin: 4px 0;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }
    .quiz-choice:hover { border-color: #4a90d9; background: #f0f7ff; }
    .quiz-choice.correct { border-color: #28a745; background: #d4edda; }
    .quiz-choice.incorrect { border-color: #dc3545; background: #f8d7da; }
    .quiz-choice.disabled { pointer-events: none; opacity: 0.7; }
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding: 16px 0;
    }
    .nav-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-prev { background: #6c757d; color: white; }
    .btn-prev:hover:not(:disabled) { background: #5a6268; }
    .btn-next { background: #4a90d9; color: white; }
    .btn-next:hover:not(:disabled) { background: #357abd; }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #dee2e6;
      border-radius: 3px;
      margin: 16px 0;
    }
    .progress-fill {
      height: 100%;
      background: #4a90d9;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .completion-message {
      text-align: center;
      padding: 40px;
      background: #d4edda;
      border-radius: 8px;
      margin-top: 24px;
    }
    .completion-message h2 { color: #155724; margin-bottom: 8px; }
    .completion-message p { color: #155724; }
  </style>
</head>
<body>
  <div id="app">
    <div id="course-content"></div>
    <div class="nav-controls">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="prevScreen()">Previous</button>
      <span id="progress-text"></span>
      <button class="nav-btn btn-next" id="btn-next" onclick="nextScreen()">Next</button>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
  <script src="js/runtime.js"></script>
</body>
</html>
