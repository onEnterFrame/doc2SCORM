<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc2SCORM Course</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gradient-start: #6abf78;
      --gradient-end: #7acc8e;
      --accent: #1b5e2f;
      --text-on-glass: #1a3a2a;
      --text-on-glass-secondary: rgba(26,58,42,0.7);
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      background-attachment: fixed;
      color: var(--text-on-glass);
      line-height: 1.6;
      min-height: 100vh;
    }

    #app {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px 120px;
      position: relative;
    }

    /* ── Header ── */
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .course-title {
      font-size: 1.3em;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0, 60, 20, 0.1);
    }

    .player-meta {
      color: rgba(255,255,255,0.6);
      font-size: 0.85em;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* ── Course progress bar ── */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.7);
      border-radius: 2px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Module banner ── */
    .module-banner {
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--text-on-glass);
      text-align: center;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95em;
      margin-bottom: 16px;
    }

    /* ── Slide card ── */
    .slide {
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px;
      padding: 28px;
      min-height: 300px;
      box-shadow: 0 8px 32px rgba(0,60,20,0.12);
      animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .screen-title {
      font-size: 1.25em;
      font-weight: 700;
      color: var(--text-on-glass);
      margin-bottom: 16px;
    }

    .screen-image {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.08);
    }

    .story-text {
      color: var(--text-on-glass-secondary);
      line-height: 1.75;
      padding: 18px 20px;
      background: rgba(255,255,255,0.1);
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      margin-bottom: 16px;
      font-size: 1.02em;
    }

    .on-screen-text {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1em;
      margin-bottom: 16px;
      text-align: center;
    }

    .narration-fallback {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .narration-label {
      font-size: 0.7em;
      text-transform: uppercase;
      color: var(--text-on-glass-secondary);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .narration-text-fallback {
      color: var(--text-on-glass-secondary);
      font-style: italic;
      margin-top: 4px;
      line-height: 1.6;
    }

    /* ── Interaction box ── */
    .interaction-box {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    .interaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 100px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-on-glass);
      font-size: 0.72em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .interaction-prompt {
      color: var(--text-on-glass);
      font-weight: 500;
      font-size: 1.05em;
      line-height: 1.5;
    }

    /* ── Decision options ── */
    .decision-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .decision-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-on-glass);
      font-family: inherit;
      font-size: 0.95em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    .decision-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
      transform: translateX(6px);
    }

    .decision-btn:disabled { cursor: default; }

    .decision-btn.chosen {
      background: rgba(255,255,255,0.3);
      border-color: rgba(255,255,255,0.5);
      font-weight: 600;
    }

    .decision-btn.recommended {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
    }

    .decision-btn.unchosen {
      opacity: 0.35;
    }

    .feedback-panel {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-top: 16px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      animation: feedbackIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes feedbackIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .feedback-text {
      color: var(--text-on-glass);
      line-height: 1.6;
      font-size: 0.95em;
    }

    .feedback-hint {
      color: var(--text-on-glass-secondary);
      font-size: 0.85em;
      margin-top: 8px;
    }

    /* ── Quiz ── */
    .quiz-slide {
      padding: 32px;
    }

    .quiz-title {
      font-size: 1.2em;
      font-weight: 700;
      color: var(--text-on-glass);
      margin-bottom: 28px;
      text-align: center;
    }

    .quiz-question { margin-bottom: 28px; }

    .question-text {
      color: var(--text-on-glass);
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 1.05em;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: var(--text-on-glass-secondary);
      font-family: inherit;
      font-size: 0.95em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    .choice-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.45);
      color: var(--text-on-glass);
    }

    .choice-btn:disabled { cursor: default; }

    .choice-indicator {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78em;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.3s;
      color: var(--text-on-glass-secondary);
    }

    .choice-btn.correct {
      background: rgba(255,255,255,0.28);
      border-color: rgba(255,255,255,0.45);
      color: var(--text-on-glass);
      font-weight: 600;
    }

    .choice-btn.correct .choice-indicator {
      background: var(--accent);
      color: #fff;
    }

    .choice-btn.incorrect {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      color: rgba(26,58,42,0.5);
    }

    .choice-btn.incorrect .choice-indicator {
      background: rgba(255,255,255,0.2);
      color: var(--text-on-glass-secondary);
    }

    .choice-btn.revealed {
      opacity: 0.4;
      pointer-events: none;
    }

    .choice-btn.correct.revealed,
    .choice-btn.incorrect.revealed {
      opacity: 1;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.25);
    }

    .bottom-bar-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    .btn-prev {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-on-glass-secondary);
    }

    .btn-prev:hover:not(:disabled) {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.35);
      color: var(--text-on-glass);
    }

    .btn-next, .btn-finish {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(27,94,47,0.2);
    }

    .btn-next:hover, .btn-finish:hover {
      box-shadow: 0 4px 16px rgba(27,94,47,0.35);
    }

    .bar-center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    /* ── Custom audio player ── */
    .ap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      user-select: none;
    }

    .ap-play {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15);
      color: var(--text-on-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .ap-play:hover {
      background: rgba(255,255,255,0.28);
      border-color: rgba(255,255,255,0.45);
    }

    .ap-play svg { width: 14px; height: 14px; }

    .ap-track-hit {
      flex: 1;
      padding: 8px 0;
      cursor: pointer;
      min-width: 40px;
    }

    .ap-track {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      position: relative;
    }

    .ap-track-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255,255,255,0.6);
      border-radius: 3px;
      pointer-events: none;
    }

    .ap-thumb {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      transform: translate(-50%, -50%);
      cursor: grab;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: all 0.15s ease;
    }

    .ap:hover .ap-thumb {
      width: 14px;
      height: 14px;
      background: #fff;
    }

    .ap-time {
      color: var(--text-on-glass-secondary);
      font-size: 0.72em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 66px;
      text-align: right;
    }

    /* ── Autoplay toggle ── */
    .autoplay-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-on-glass-secondary);
      font-size: 0.72em;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .autoplay-toggle input { display: none; }

    .toggle-track {
      width: 28px;
      height: 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      position: relative;
      transition: background 0.3s;
    }

    .autoplay-toggle input:checked + .toggle-track {
      background: var(--accent);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    .autoplay-toggle input:checked + .toggle-track .toggle-thumb {
      transform: translateX(12px);
      background: #fff;
    }

    /* ── Transcript toggle ── */
    .transcript-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: var(--text-on-glass-secondary);
      font-family: inherit;
      font-size: 0.72em;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .transcript-btn:hover,
    .transcript-btn.active {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.35);
      color: var(--text-on-glass);
    }

    .transcript-btn svg { width: 13px; height: 13px; }

    /* ── Transcript panel ── */
    .transcript-panel {
      max-width: 800px;
      margin: 10px auto 0;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
    }

    .transcript-text {
      color: var(--text-on-glass-secondary);
      font-style: italic;
      line-height: 1.65;
      font-size: 0.92em;
    }

    /* ── Completion ── */
    .completion-message {
      text-align: center;
      padding: 48px 32px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,60,20,0.12);
    }

    .completion-message h2 {
      color: var(--text-on-glass);
      font-size: 1.5em;
      margin-bottom: 12px;
    }

    .completion-message p {
      color: var(--text-on-glass-secondary);
      font-size: 1.05em;
    }

    /* ── Hidden audio element ── */
    audio.hidden-audio { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="player-header" class="player-header" style="display:none">
      <h2 id="course-title" class="course-title"></h2>
      <div id="player-meta" class="player-meta"></div>
    </div>
    <div id="progress-track" class="progress-track" style="display:none">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="course-content"></div>
    <div id="transcript-panel" class="transcript-panel" style="display:none">
      <p id="transcript-text" class="transcript-text"></p>
    </div>
  </div>

  <div id="bottom-bar" class="bottom-bar" style="display:none">
    <div class="bottom-bar-inner">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="prevScreen()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="bar-center">
        <div id="audio-player" class="ap" style="display:none">
          <button class="ap-play" id="ap-play" onclick="toggleAudio()">
            <svg id="ap-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.04-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/></svg>
            <svg id="ap-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <div class="ap-track-hit" id="ap-track-hit">
            <div class="ap-track">
              <div class="ap-track-fill" id="ap-fill"></div>
              <div class="ap-thumb" id="ap-thumb"></div>
            </div>
          </div>
          <span class="ap-time" id="ap-time">0:00 / 0:00</span>
        </div>
        <label class="autoplay-toggle">
          <input type="checkbox" id="autoplay-check" checked>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          Auto-play
        </label>
        <button id="transcript-btn" class="transcript-btn" onclick="toggleTranscript()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Transcript
        </button>
      </div>
      <button class="nav-btn btn-next" id="btn-next" onclick="nextScreen()">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <audio id="hidden-audio" class="hidden-audio" preload="auto"></audio>
  <script src="js/runtime.js"></script>
</body>
</html>
